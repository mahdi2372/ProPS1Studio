name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (Windows)
    # The whole solution targets net8.0-windows (WPF + Win32 PE/Authenticode code), so it
    # must run on a Windows runner. Integration tests skip gracefully when ps2exe/UPX
    # are not installed; the Core.Tests suite is fully self-contained.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProPS1Studio.sln

      - name: Build (Release)
        run: dotnet build ProPS1Studio.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test ProPS1Studio.sln -c Release --no-build --logger "console;verbosity=normal"
